<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceDesk · 线稿描绘台</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#243c40;font:15px system-ui}header{background:#183d43;color:#fff;padding:20px 30px;display:flex;gap:25px;align-items:center}header h1{margin:0}a{color:#257d85}header a{color:#a7e4dc}main{padding:22px;display:grid;grid-template-columns:280px 1fr 300px;gap:20px}section{background:white;border:1px solid #ddd8ce;border-radius:14px;padding:18px}h2{font-size:17px;margin:0 0 14px}button,input,select,textarea{font:inherit;border:1px solid #cad0cd;border-radius:6px;padding:7px;margin:3px 0}button{cursor:pointer;background:#eef4ef;color:#24494d}button.primary{background:#236b70;color:white}input[type=number]{width:75px}input[type=text],select,textarea{width:100%}.row{display:flex;gap:5px;flex-wrap:wrap}small{display:block;color:#77817e}#status{padding:12px 30px;background:#e1eee7;min-height:45px}canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 3px 15px #2333;cursor:crosshair;image-rendering:auto}#workspace{text-align:center;background:#e8e8df;padding:25px;min-height:450px}.thumb{width:70px;height:58px;object-fit:contain;border:1px solid #ccc}.asset{display:flex;gap:8px;margin:9px 0;align-items:center}.selected{background:#d7eee8}.path{padding:7px;border-bottom:1px solid #ddd;cursor:pointer}.links a{display:inline-block;margin:7px}.muted{color:#77817e}@media(max-width:1000px){main{grid-template-columns:240px 1fr}main>section:last-child{grid-column:1/-1}}</style>
<header><h1>TraceDesk</h1><span>线稿描绘台 · 手工单线矢量</span><a href="/prepare" target="_blank">图像准备工作区 ↗</a></header><div id="status">选择或新建图稿，用鼠标逐点描线。</div><main><section><h2>图稿与底图</h2><select id="drawings" aria-label="选择图稿"></select><div class="row"><button id="new">新建图稿</button><button id="duplicate">复制图稿</button></div><input id="name" placeholder="图稿名称"><div class="row"><button id="rename">保存名称</button><button id="demo">生成合成线稿</button></div><input id="upload" type="file" accept="image/*" aria-label="上传底图"><div id="assets"></div><small>底图最长边2048px。已有路径时不改变画布尺寸；选底图前可新建图稿。</small><hr><label>底图透明度 <input type="number" id="opacity" value="0.35" step="0.05" min="0" max="1"></label><label>线宽 <input type="number" id="width" value="2" step="0.2" min="0.2" max="20"></label><input type="color" id="stroke" value="#256b72" aria-label="线色"><button id="style">应用显示</button><hr><h2>恢复图稿</h2><input id="importfile" type="file" accept=".json" aria-label="导入图稿JSON"><small>从本工作区ZIP中取drawing.json导入；原素材仍须在库中。</small></section><section><h2>描绘画布</h2><div class="row"><button id="start" class="primary">开始新路径</button><button id="finish">完成路径</button><button id="cancel">取消草稿</button><label><input type="checkbox" id="closed">闭合</label><button id="undo">撤销</button><button id="redo">重做</button></div><small>开始后在图上逐点点击，完成保存。橙色为当前节点；单击已有节点可选中，在右侧改坐标。</small><div id="workspace"><canvas id="canvas" width="256" height="192"></canvas></div><p id="summary" class="muted"></p><div class="links" id="exports"></div></section><section><h2>路径与节点</h2><div id="paths"></div><input id="pathName" placeholder="路径名称"><button id="pathsave">保存路径名称/闭合状态</button><div class="row"><button id="reverse">反向</button><button id="copy">复制路径</button><button id="delete">删除路径</button></div><hr><label>节点 <input id="node" type="number" value="1" min="1"></label><div class="row"><label>X <input id="x" type="number" value="0" step="0.1"></label><label>Y <input id="y" type="number" value="0" step="0.1"></label></div><button id="point">修改节点</button><button id="delpoint">删除节点</button><hr><div class="row"><label>ΔX <input id="dx" type="number" value="0"></label><label>ΔY <input id="dy" type="number" value="0"></label></div><button id="move">平移路径</button><hr><button id="clear">清空路径</button><small>导出的PNG/SVG只含矢量描线；底图在ZIP中独立保留。当前提供人工描线，不自动猜测线条。</small></section></main>
<script>
let state={images:[],layouts:[]},p=null,selected=null,draft=null,bg=null;const $=id=>document.getElementById(id);function msg(s,err=false){$('status').textContent=s;$('status').style.background=err?'#f8ded4':'#e1eee7'}async function api(url,b,form){let r=await fetch(url,b?{method:'POST',headers:form?{}:{'Content-Type':'application/json'},body:form?b:JSON.stringify(b)}:{});let j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}function run(fn){return async()=>{try{await fn()}catch(e){msg(e.message,true)}}}async function refresh(id){state=await api('/tracedesk/state');$('drawings').innerHTML=state.layouts.map(v=>`<option value="${v.id}">${escapeHtml(v.name)}</option>`).join('');$('assets').innerHTML=state.images.map(v=>`<div class="asset"><img class="thumb" src="/tracedesk/images/${v.id}.png"><div>${escapeHtml(v.name)}<br><button data-image="${v.id}">设为底图</button></div></div>`).join('');for(let b of document.querySelectorAll('[data-image]'))b.onclick=run(()=>edit({action:'image',image_id:b.dataset.image}));if(id||p?.id||state.layouts[0])await load(id||p?.id||state.layouts[0].id)}function escapeHtml(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML}async function load(id){let j=await api('/tracedesk/drawings/'+id);p=j.drawing;$('drawings').value=id;draft=null;if(!p.paths.some(v=>v.id===selected))selected=p.paths[0]?.id||null;$('name').value=p.name;$('opacity').value=p.image_opacity;$('width').value=p.line_width;$('stroke').value=p.stroke;bg=null;if(p.image_id){bg=new Image;bg.onload=paint;bg.src='/tracedesk/images/'+p.image_id+'.png'}renderUI();paint()}function renderUI(){if(!p)return;let q=p.paths.find(v=>v.id===selected);$('paths').innerHTML=p.paths.map(v=>`<div class="path ${v.id===selected?'selected':''}" data-path="${v.id}">${escapeHtml(v.name)} · ${v.points.length}点 ${v.closed?'闭环':''}</div>`).join('');for(let el of document.querySelectorAll('[data-path]'))el.onclick=()=>{selected=el.dataset.path;renderUI();paint()};if(q){$('pathName').value=q.name;$('closed').checked=q.closed;let i=Math.min(q.points.length-1,Math.max(0,Number($('node').value)-1));$('node').max=q.points.length;$('node').value=i+1;$('x').value=q.points[i][0];$('y').value=q.points[i][1]}let count=p.paths.reduce((s,v)=>s+v.points.length,0);$('summary').textContent=`${p.width} × ${p.height}px · ${p.paths.length}条路径 · ${count}个节点 · 修订 ${p.revision}`;$('exports').innerHTML=`<a href="/tracedesk/drawings/${p.id}.png?download=1" download>下载PNG</a><a href="/tracedesk/drawings/${p.id}.svg" download>下载SVG</a><a href="/tracedesk/drawings/${p.id}.zip" download>下载工程ZIP</a>`}function paint(){if(!p)return;let c=$('canvas'),ctx=c.getContext('2d');c.width=p.width;c.height=p.height;ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);if(bg?.complete){ctx.globalAlpha=p.image_opacity;ctx.drawImage(bg,0,0);ctx.globalAlpha=1}for(let q of [...p.paths,...(draft?[{points:draft,closed:$('closed').checked,id:'draft'}]:[])]){if(!q.points?.length)continue;ctx.beginPath();ctx.moveTo(...q.points[0]);for(let v of q.points.slice(1))ctx.lineTo(...v);if(q.closed)ctx.closePath();ctx.strokeStyle=q.id==='draft'?'#d67034':p.stroke;ctx.lineWidth=p.line_width;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();if(q.id===selected||q.id==='draft')for(let [x,y] of q.points){ctx.beginPath();ctx.arc(x,y,2.8,0,Math.PI*2);ctx.fillStyle='#e97636';ctx.fill()}}}async function edit(b){if(!p)throw Error('请先新建图稿');let j=await api('/tracedesk/drawings/'+p.id+'/edit',{...b,revision:p.revision});p=j.drawing;draft=null;await refresh(p.id);msg('已保存；修订 '+p.revision)}function pathData(action,extra={}){if(!selected)throw Error('请选择路径');return {action,path_id:selected,...extra}}$('new').onclick=run(async()=>{let j=await api('/tracedesk/drawings',{name:'新描线图稿'});await refresh(j.drawing.id);msg('图稿已创建')});$('drawings').onchange=run(() =>load($('drawings').value));$('demo').onclick=run(async()=>{await api('/tracedesk/demo',{});await refresh();msg('已生成合成线稿，请设为底图')});$('upload').onchange=run(async()=>{let f=$('upload').files[0];if(!f)return;let b=new FormData;b.append('file',f);await api('/tracedesk/upload',b,true);await refresh();msg('底图已上传')});$('rename').onclick=run(()=>edit({action:'settings',name:$('name').value}));$('style').onclick=run(()=>edit({action:'settings',image_opacity:Number($('opacity').value),line_width:Number($('width').value),stroke:$('stroke').value}));$('duplicate').onclick=run(async()=>{if(!p)throw Error('请先选择图稿');let j=await api('/tracedesk/drawings/'+p.id+'/duplicate',{});await refresh(j.drawing.id)});$('start').onclick=()=>{if(!p)return msg('请先新建图稿',true);draft=[];msg('正在描线：点击画布添点，至少2点后完成路径');paint()};$('cancel').onclick=()=>{draft=null;paint();msg('已取消未保存的路径')};$('finish').onclick=run(async()=>{if(!draft||draft.length<2)throw Error('请至少点击两个点');await edit({action:'add',points:draft,closed:$('closed').checked,name:'描线路径 '+(p.paths.length+1)});selected=p.paths.at(-1)?.id;renderUI();paint()});$('canvas').onclick=e=>{if(!p)return;let box=e.target.getBoundingClientRect(),x=Math.round((e.clientX-box.left)*p.width/box.width*10)/10,y=Math.round((e.clientY-box.top)*p.height/box.height*10)/10;if(draft){draft.push([x,y]);paint()}else{let q=p.paths.find(q=>q.id===selected);if(q){let i=q.points.reduce((best,v,i)=>Math.hypot(v[0]-x,v[1]-y)<Math.hypot(q.points[best][0]-x,q.points[best][1]-y)?i:best,0);$('node').value=i+1;renderUI()}}};for(let action of ['undo','redo'])$(action).onclick=run(async()=>{if(!p)return;await api('/tracedesk/drawings/'+p.id+'/history',{revision:p.revision,action});await refresh(p.id);msg(action==='undo'?'已撤销':'已重做')});$('pathsave').onclick=run(()=>edit(pathData('path',{name:$('pathName').value,closed:$('closed').checked})));for(let action of ['reverse','delete'])$(action).onclick=run(()=>edit(pathData(action)));$('copy').onclick=run(()=>edit(pathData('duplicate')));$('point').onclick=run(()=>edit(pathData('point',{index:Number($('node').value)-1,x:Number($('x').value),y:Number($('y').value)})));$('delpoint').onclick=run(()=>edit(pathData('delete_point',{index:Number($('node').value)-1})));$('move').onclick=run(()=>edit(pathData('move',{dx:Number($('dx').value),dy:Number($('dy').value)})));$('node').onchange=()=>{renderUI();paint()};$('clear').onclick=run(()=>edit({action:'clear'}));$('importfile').onchange=run(async()=>{let f=$('importfile').files[0];if(!f)return;let drawing=JSON.parse(await f.text());let j=await api('/tracedesk/import',{drawing});await refresh(j.drawing.id);msg('工程图稿已恢复')});run(()=>refresh())();
</script></html>
